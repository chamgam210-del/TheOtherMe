# One-click deploy: https://render.com/deploy?repo=https://github.com/chamgam210-del/TheOtherMe
# Needs a paid instance (the "starter" plan) because the owner's data lives on a persistent disk.
services:
  - type: web
    name: cloneme
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: cloneme-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PERSISTENT_STORAGE
        value: "true"
      # Generated by Render at deploy time; the owner copies SETUP_TOKEN into the app once.
      - key: SESSION_SECRET
        generateValue: true
      - key: PERSONA_LLM_SHARED_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
